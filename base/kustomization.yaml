apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bluegreen-lab

resources:
  - namespace.yaml
  - blue-nginx.yaml
  - green-apache.yaml
  - service.yaml

configMapGenerator:
  - name: blue-html
    files:
      - index.html=html/blue.html
  - name: green-html
    files:
      - index.html=html/green.html
