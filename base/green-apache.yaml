apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
  labels:
    app: web
    color: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      color: green
  template:
    metadata:
      labels:
        app: web
        color: green
    spec:
      containers:
        - name: apache
          image: httpd:2.4-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: html
              mountPath: /usr/local/apache2/htdocs
      volumes:
        - name: html
          configMap:
            name: green-html
